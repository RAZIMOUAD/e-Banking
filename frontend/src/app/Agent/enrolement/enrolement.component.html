<div style="background-color: #475569; padding-top: 64px;">
  <app-navbar></app-navbar>
  <div class="p-5">

    <!-- Step Navigation Header -->
    <div class="bs-stepper-header border-none pt-3 px-0 mb-4">
      <div class="step active" data-target="#accountDetailsValidation">
        <div class="step-trigger" aria-selected="true">
          <span class="bs-stepper-circle"><i class="bx bx-home"></i></span>
          <span class="bs-stepper-label">
          <span class="bs-stepper-title">Client</span><br>
          <small>Personal Information</small>
        </span>
        </div>
      </div>
      <div class="line"><i class="bx bx-chevron-right"></i></div>
      <div class="step" data-target="#personalInfoValidation">
        <div class="step-trigger">
          <span class="bs-stepper-circle"><i class="bx bx-user"></i></span>
          <span class="bs-stepper-label">
          <span class="bs-stepper-title">Contact</span><br>
          <small>Contact Details</small>
        </span>
        </div>
      </div>
    </div>

    <!-- Account Step -->
    <div id="accountDetailsValidation" class="form-section">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="nom" class="form-label">Nom</label>
          <input type="text" class="form-control" id="nom" name="nom" required>
        </div>
        <div class="col-md-6">
          <label for="prenom" class="form-label">Prénom</label>
          <input type="text" class="form-control" id="prenom" name="prenom" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="dateNaissance" class="form-label">Date de naissance</label>
          <input type="date" class="form-control" id="dateNaissance" name="dateNaissance" required>
        </div>
        <div class="col-md-6">
          <label for="genre" class="form-label">Genre</label>
          <select class="form-select" id="genre" name="genre" required>
            <option value="">-- Sélectionner --</option>
            <option value="homme">Homme</option>
            <option value="femme">Femme</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="telephone" class="form-label">Numéro de téléphone</label>
          <input type="tel" class="form-control" id="telephone" name="telephone" required>
        </div>
        <div class="col-md-6">
          <label for="nationalite" class="form-label">CIN</label>
          <input type="text" class="form-control" id="nationalite" name="nationalite" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="adresse" class="form-label">Adresse</label>
        <input type="text" class="form-control" id="adresse" name="adresse" required>
      </div>

      <div class="mb-3">
        <label for="cin" class="form-label">Nationalité</label>
        <input type="text" class="form-control" id="cin" name="cin" required>
      </div>



    </div>

    <!-- Personal Step -->
    <div id="personalInfoValidation" class="form-section">
      <div class="mb-3">
        <label for="email" class="form-label">Adresse e-mail</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="password" class="form-label">Mot de passe</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="col-md-6">
          <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="statut" class="form-label">Statut</label>
        <select class="form-select" id="statut" name="statut" required>
          <option value="">-- Sélectionner --</option>
          <option value="actif">Actif</option>
          <option value="inactif">Inactif</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label d-block mb-2">Authentification à deux facteurs (2FA)</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="2fa" id="2faYes" value="yes" required>
          <label class="form-check-label" for="2faYes">Activé</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="2fa" id="2faNo" value="no" required>
          <label class="form-check-label" for="2faNo">Non activé</label>
        </div>




      </div>
    </div>
  </div>
  <app-footer></app-footer>
</div>
