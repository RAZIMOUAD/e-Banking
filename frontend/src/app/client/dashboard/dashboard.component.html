<div class="p-6">
  <h2 class="text-2xl font-bold mb-4">Vos comptes</h2>
  <div class="grid md:grid-cols-2 gap-4">
    <div *ngFor="let compte of comptes" class="bg-white p-4 rounded shadow">
      <h3 class="text-lg font-semibold">Compte {{ compte.type }}</h3>
      <p class="text-3xl font-bold text-green-600">
        {{ compte.solde | number: '1.2-2' }} {{ compte.devise }}
      </p>
    </div>
  </div>

  <!-- 🔍 Analyse budgétaire -->
  <div class="mt-10">
    <h2 class="text-2xl font-bold mb-4">Analyse budgétaire</h2>
    <div class="grid md:grid-cols-2 gap-6">
      <!-- 📈 Line Chart -->
      <div class="bg-white p-4 rounded shadow">
        <h3 class="text-lg font-semibold mb-2">Évolution du budget</h3>
        <canvas baseChart
                [data]="lineChartData"
                [options]="lineChartOptions"
                [type]="'line'">
        </canvas>
      </div>

      <!-- 🥧 Pie Chart -->
      <div class="bg-white p-4 rounded shadow">
        <h3 class="text-lg font-semibold mb-2">Répartition des dépenses</h3>
        <canvas baseChart
                [data]="pieChartData"
                [type]="'pie'">
        </canvas>
      </div>
    </div>
  </div>
</div>
