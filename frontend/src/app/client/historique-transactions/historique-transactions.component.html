<div class="p-6">
  <h2 class="text-2xl font-bold mb-4">Historique des transactions</h2>
  <table class="w-full table-auto border">
    <thead class="bg-gray-200">
    <tr>
      <th class="p-2 text-left">Date</th>
      <th class="p-2 text-left">Libellé</th>
      <th class="p-2 text-right">Montant (€)</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let t of transactions" class="border-t">
      <td class="p-2">{{ t.date }}</td>
      <td class="p-2">{{ t.libelle }}</td>
      <td class="p-2 text-right" [ngClass]="{ 'text-red-600': t.montant < 0, 'text-green-600': t.montant >= 0 }">
        {{ t.montant | number: '1.2-2' }}
      </td>
    </tr>
    </tbody>
  </table>
</div>
