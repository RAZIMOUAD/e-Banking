<div class="p-6 max-w-xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Recharge</h2>
  <form (ngSubmit)="effectuerRecharge()" class="space-y-4">
    <select [(ngModel)]="operateur" name="operateur" class="w-full p-2 border rounded">
      <option>Orange</option>
      <option>inwi</option>
      <option>Maroc Telecom</option>
    </select>
    <input [(ngModel)]="numero" name="numero" placeholder="Numéro / Référence" class="w-full p-2 border rounded" required />
    <select [(ngModel)]="type" name="type" class="w-full p-2 border rounded">
      <option>Credit</option>
      <option>Forfait</option>
    </select>
    <input [(ngModel)]="montant" name="montant" type="number" placeholder="Montant (€)" class="w-full p-2 border rounded" required />
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Recharger</button>
  </form>
</div>
