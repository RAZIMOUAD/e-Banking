<div class="virement-form p-6 max-w-xl mx-auto bg-white rounded-lg shadow-md">
<div class="p-6 max-w-xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Virement externe</h2>
  <form (ngSubmit)="effectuerVirementExterne()" class="space-y-4">

    <label>Compte Source</label>
    <select [(ngModel)]="compteSourceId" name="compteSourceId" class="w-full p-2 border rounded" required>
      <option value="" disabled>-- Sélectionnez un compte --</option>
      <option *ngFor="let compte of comptesDisponibles" [value]="compte.id">
        {{ compte.IBAN }} ({{ compte.soldeDisponible }} €)
      </option>
    </select>

    <label>Nom du Bénéficiaire</label>
    <input [(ngModel)]="nomBeneficiaire" name="nomBeneficiaire" placeholder="Nom complet"
           class="w-full p-2 border rounded" required />

    <label>IBAN du Bénéficiaire</label>
    <input [(ngModel)]="ibanBeneficiaire" name="ibanBeneficiaire" placeholder="FR..."
           class="w-full p-2 border rounded" required />

    <label>Banque du Bénéficiaire</label>
    <select [(ngModel)]="banque" name="banque" required class="w-full p-2 border rounded">
      <option value="" disabled>-- Choisissez une banque --</option>
      <option *ngFor="let banque of banquesDisponibles" [value]="banque">{{ banque }}</option>
    </select>

    <label>Montant</label>
    <input [(ngModel)]="montant" type="number" name="montant" placeholder="Montant"
           class="w-full p-2 border rounded" required />

    <label>Motif</label>
    <input [(ngModel)]="motif" name="motif" placeholder="Motif du virement"
           class="w-full p-2 border rounded" required />

    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Valider</button>
  </form>
</div>
</div>
