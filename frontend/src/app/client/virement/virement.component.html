<div class="p-6 max-w-xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Effectuer un virement</h2>
  <form (ngSubmit)="effectuerVirement()" class="space-y-4">
    <select [(ngModel)]="compteSource" name="compteSource" required class="w-full p-2 border rounded">
      <option *ngFor="let c of comptes" [value]="c">{{ c }}</option>
    </select>
    <input [(ngModel)]="destinataire" name="destinataire" placeholder="Destinataire" class="w-full p-2 border rounded" required />
    <input [(ngModel)]="montant" type="number" name="montant" placeholder="Montant" class="w-full p-2 border rounded" required />
    <input [(ngModel)]="motif" name="motif" placeholder="Motif" class="w-full p-2 border rounded" required />
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Valider</button>
  </form>
</div>
